<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VispNote</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: vispnote-asset: https:; connect-src 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'none'" />
<link rel="icon" type="image/png" href="assets/vispnote-icon.png" />
<link rel="stylesheet" href="node_modules/katex/dist/katex.min.css" />
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--mn-bg, #f6f7f9); }
  * { box-sizing: border-box; }
  button { font: inherit; }
  input, textarea { font: inherit; color: inherit; }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  [role="button"]:focus-visible,
  [role="option"]:focus-visible {
    outline: 2px solid var(--mn-focus, #4f6fd5) !important;
    outline-offset: 2px;
  }
  .mn-note-title-input:focus-visible {
    outline: none !important;
    box-shadow: inset 0 -2px 0 color-mix(in oklab, var(--mn-focus, #4f6fd5) 70%, transparent);
  }
  .mn-contextual-assistance-trigger-label { display: none; }
  /* Views: the open affordance is quiet until you are on the row, and the bar
     along a card's bottom edge is not drawn until then at all. Doing this in
     CSS rather than React state matters — a view can hold hundreds of cards,
     and re-rendering one on every pointer enter and leave is a lot of work to
     show a strip that was already in the DOM. Both stay reachable by keyboard:
     focus-within reveals the bar the moment Tab lands inside it. */
  .mn-view-card-bar { opacity: 0; transition: opacity 110ms ease; }
  .mn-view-card:hover .mn-view-card-bar,
  .mn-view-card:focus-within .mn-view-card-bar { opacity: 1; }
  .mn-view-mark { opacity: 0.4; transition: opacity 110ms ease; }
  .mn-view-row:hover .mn-view-mark,
  .mn-view-row:focus-within .mn-view-mark,
  .mn-view-mark:focus-visible { opacity: 1; }
  /* Graph: the canvas and its nodes are things you take hold of, so the
     cursor closes while the button is down. Pure CSS — a React state for
     this would re-render every node on every press. */
  [data-mn-graph-canvas]:active { cursor: grabbing; }
  [data-mn-graph-node]:active { cursor: grabbing; }
  @media (max-width: 1050px) {
    .mn-contextual-assistance-trigger {
      width: 32px;
      padding-inline: 0 !important;
    }
    .mn-contextual-assistance-trigger-label { display: none; }
  }
  /* Scrollbar COLOUR is deliberately not set here. The theme effect sets
     `color-scheme` from the theme's own background lightness, which gives the
     native scrollbar — and <select> popups, and form controls — the right
     family. Hand-written light greys stayed light under a dark theme.
     Width still is: dropping the sizing with the colours put a ~15px classic
     Chromium scrollbar back on every scroll surface, eating layout width in
     the sidebar, note list and editor. `scrollbar-width` respects
     `color-scheme` on its own, so the thumb colour stays native. */
  * { scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes mnFadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mnSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnLaunchFloat {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -5px, 0) rotate(0.35deg); }
  }
  @keyframes mnLaunchScan {
    0% { transform: translateX(-120%); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
  }
  @keyframes mnLaunchPulse {
    0%, 100% { opacity: 0.42; transform: scale(0.94); }
    50% { opacity: 0.9; transform: scale(1); }
  }
  @keyframes mnLaunchDraw {
    from { stroke-dashoffset: 72; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes mnStatusBreath {
    0%, 100% { opacity: 0.64; }
    50% { opacity: 0.92; }
  }
  @keyframes mnLightBloom {
    0%, 100% {
      opacity: 0.2;
      transform: scale(0.74);
    }
    50% {
      opacity: 0.58;
      transform: scale(0.98);
    }
  }
  @keyframes mnLightWash {
    0%, 100% { opacity: 0.28; transform: translate3d(-0.8%, -0.8%, 0); }
    50% { opacity: 0.58; transform: translate3d(0.8%, 0.8%, 0); }
  }
  @keyframes mnBootProgress {
    0% { transform: translateX(-78%) scaleX(0.34); opacity: 0.48; }
    42% { transform: translateX(-8%) scaleX(0.86); opacity: 0.96; }
    100% { transform: translateX(118%) scaleX(0.42); opacity: 0.44; }
  }
  .mn-boot-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, transparent 44%),
      linear-gradient(135deg, rgba(248, 238, 247, 0.58), rgba(237, 245, 255, 0.68) 46%, rgba(241, 250, 245, 0.62));
    color: #253044;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    transition: opacity 220ms ease;
  }
  .mn-boot-grid {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background-image:
      linear-gradient(rgba(86,99,124,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86,99,124,0.08) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }
  .mn-boot-light-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .mn-boot-light-field::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 24%, rgba(243,191,216,0.42), transparent 34%),
      radial-gradient(circle at 78% 18%, rgba(169,194,255,0.44), transparent 36%),
      radial-gradient(circle at 76% 76%, rgba(159,226,201,0.4), transparent 38%),
      radial-gradient(circle at 20% 78%, rgba(245,213,142,0.34), transparent 36%);
    animation: mnLightWash 10.5s ease-in-out infinite;
  }
  .mn-light-bloom {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, color-mix(in oklab, var(--bloom-color) 18%, white) 24%, color-mix(in oklab, var(--bloom-color) 34%, transparent) 48%, transparent 70%);
    transform-origin: center;
    animation: mnLightBloom var(--bloom-duration) ease-in-out infinite;
    animation-delay: var(--bloom-delay);
  }
  .mn-boot-title {
    position: relative;
    z-index: 1;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 52px;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1;
    color: #253044;
  }
  .mn-boot-brand {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: mnLaunchFloat 5.8s ease-in-out infinite;
    isolation: isolate;
  }
  .mn-boot-brand::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 48%;
    width: min(560px, 78vw);
    height: 170px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.76), rgba(255,255,255,0.28) 42%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }
  .mn-boot-logo {
    position: relative;
    z-index: 1;
    display: block;
    width: clamp(340px, 54vw, 720px);
    height: auto;
    max-height: 190px;
    object-fit: contain;
    margin: 0 auto 18px;
    mix-blend-mode: multiply;
    filter: drop-shadow(0 18px 34px rgba(36, 48, 71, 0.08));
  }
  .mn-boot-wordmark {
    display: none;
    align-items: baseline;
    justify-content: center;
  }
  .mn-word-omni {
    color: #243047;
  }
  .mn-word-note {
    color: #9a96ff;
    background: linear-gradient(90deg, #9d98ff 0%, #a6bcff 52%, #ff9a91 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .mn-boot-tagline {
    position: relative;
    z-index: 1;
    margin-top: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2d3952;
  }
  .mn-boot-tagline i {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, #9d98ff, #a6bcff);
  }
  .mn-boot-subtitle {
    position: relative;
    z-index: 1;
    margin-top: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5d687e;
  }
  .mn-boot-status {
    position: relative;
    z-index: 1;
    margin-top: 16px;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #56647c;
    animation: mnStatusBreath 2.4s ease-in-out infinite;
  }
  .mn-boot-progress {
    position: relative;
    z-index: 1;
    width: min(230px, calc(100vw - 96px));
    height: 5px;
    margin-top: 18px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(84, 98, 126, 0.13);
    border: 1px solid rgba(255,255,255,0.62);
    box-shadow: 0 8px 20px rgba(78, 91, 122, 0.1);
  }
  .mn-boot-progress div {
    width: 62%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #f3bfd8 0%, #a9c2ff 48%, #9fe2c9 100%);
    transform-origin: left center;
    animation: mnBootProgress 1.65s cubic-bezier(.65,0,.35,1) infinite;
  }
  .mn-boot-core {
    position: relative;
    width: min(620px, calc(100vw - 48px));
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: mnSlideUp 420ms cubic-bezier(.2,.8,.2,1);
  }
  /* Reduced motion is honoured app-wide, not only on the boot splash. Anything
     whose entire signal lives in a keyframe carries a static fallback in its
     own component stylesheet (see .mn-ask-ai-shimmer, .mn-ai-text-working,
     .mn-ai-live-dots). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      animation-delay: 0ms !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="mn-boot-splash" class="mn-boot-splash">
  <div class="mn-boot-grid"></div>
  <div class="mn-boot-light-field" aria-hidden="true">
    <span class="mn-light-bloom" style="--bloom-color:#f3bfd8; --bloom-duration:7.6s; --bloom-delay:-1.2s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#a9c2ff; --bloom-duration:8.8s; --bloom-delay:-3.4s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#9fe2c9; --bloom-duration:9.6s; --bloom-delay:-5.1s;"></span>
  </div>
  <div class="mn-boot-core">
    <div class="mn-boot-brand" aria-label="VispNote">
      <img class="mn-boot-logo" src="assets/vispnote-loading-transparent.png" alt="VispNote" />
      <div class="mn-boot-title mn-boot-wordmark">VispNote</div>
      <div class="mn-boot-tagline"><span>Write</span><i></i><span>Connect</span><i></i><span>Act</span></div>
    </div>
    <div class="mn-boot-subtitle">Connecting your workspace</div>
    <div class="mn-boot-status">Opening vault and indexing notes</div>
    <div class="mn-boot-progress"><div></div></div>
  </div>
</div>

<script src="node_modules/react/umd/react.production.min.js"></script>
<script src="node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script src="node_modules/katex/dist/katex.min.js"></script>
<script src="build/renderer/app.js"></script>
</body>
</html>
