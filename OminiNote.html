<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OminiNote</title>
<meta name="viewport" content="width=1400" />
<link rel="icon" type="image/svg+xml" href="assets/omini-note-icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--mn-bg, #f6f7f9); }
  * { box-sizing: border-box; }
  button { font: inherit; }
  input, textarea { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 250 / 0.5); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.7 0.01 250 / 0.6); }

  @keyframes mnFadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mnSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnLaunchFloat {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -10px, 0) rotate(0.7deg); }
  }
  @keyframes mnLaunchScan {
    0% { transform: translateX(-120%); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
  }
  @keyframes mnLaunchPulse {
    0%, 100% { opacity: 0.42; transform: scale(0.94); }
    50% { opacity: 0.9; transform: scale(1); }
  }
  @keyframes mnLaunchDraw {
    from { stroke-dashoffset: 72; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes mnLaunchBar {
    0% { transform: translateX(-85%) scaleX(0.25); }
    45% { transform: translateX(-10%) scaleX(0.72); }
    100% { transform: translateX(100%) scaleX(0.35); }
  }
  @keyframes mnLightBloom {
    0%, 100% {
      opacity: 0.28;
      transform: scale(0.78);
    }
    50% {
      opacity: 0.86;
      transform: scale(1.04);
    }
  }
  @keyframes mnLightWash {
    0%, 100% { opacity: 0.34; transform: translate3d(-1%, -1%, 0); }
    50% { opacity: 0.7; transform: translate3d(1%, 1%, 0); }
  }
  @keyframes mnPastelRipple {
    0% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.18);
    }
    18% { opacity: 0.42; }
    78% { opacity: 0.16; }
    100% {
      opacity: 0;
      transform: translate(-50%, -50%) scale(1);
    }
  }
  .mn-boot-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(135deg, rgba(248, 238, 247, 0.62), rgba(237, 245, 255, 0.68) 44%, rgba(241, 250, 245, 0.66));
    color: #253044;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    transition: opacity 220ms ease;
  }
  .mn-boot-grid {
    position: absolute;
    inset: 0;
    opacity: 0.24;
    background-image:
      linear-gradient(rgba(86,99,124,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86,99,124,0.08) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }
  .mn-boot-light-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .mn-boot-light-field::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 24%, rgba(243,191,216,0.58), transparent 34%),
      radial-gradient(circle at 78% 18%, rgba(169,194,255,0.56), transparent 36%),
      radial-gradient(circle at 76% 76%, rgba(159,226,201,0.54), transparent 38%),
      radial-gradient(circle at 20% 78%, rgba(245,213,142,0.46), transparent 36%);
    animation: mnLightWash 9s ease-in-out infinite;
  }
  .mn-light-bloom {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.96) 0%, color-mix(in oklab, var(--bloom-color) 22%, white) 22%, color-mix(in oklab, var(--bloom-color) 44%, transparent) 46%, transparent 68%);
    transform-origin: center;
    animation: mnLightBloom var(--bloom-duration) ease-in-out infinite;
    animation-delay: var(--bloom-delay);
  }
  .mn-light-ripple {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(76vw, 76vh);
    aspect-ratio: 1;
    border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--ripple-color) 62%, transparent);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
    transform: translate(-50%, -50%) scale(0.18);
    animation: mnPastelRipple var(--ripple-duration) ease-out infinite;
    animation-delay: var(--ripple-delay);
  }
  .mn-boot-title {
    position: relative;
    z-index: 1;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 52px;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1;
    color: #253044;
  }
  .mn-boot-brand {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .mn-boot-logo {
    width: 216px;
    height: 154px;
    overflow: visible;
    margin-bottom: 6px;
  }
  .mn-boot-logo line,
  .mn-boot-logo path {
    vector-effect: non-scaling-stroke;
  }
  .mn-logo-aura {
    display: none;
  }
  .mn-logo-line {
    fill: none;
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mn-logo-line-soft {
    opacity: 0.76;
    stroke-width: 5.6;
  }
  .mn-boot-wordmark {
    display: flex;
    align-items: baseline;
    justify-content: center;
  }
  .mn-word-omni {
    color: #243047;
  }
  .mn-word-note {
    color: #9a96ff;
    background: linear-gradient(90deg, #9d98ff 0%, #a6bcff 52%, #ff9a91 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .mn-boot-tagline {
    margin-top: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #26354f;
  }
  .mn-boot-tagline i {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, #9d98ff, #a6bcff);
  }
  .mn-boot-subtitle {
    position: relative;
    z-index: 1;
    margin-top: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #667187;
  }
  .mn-boot-progress {
    position: relative;
    z-index: 1;
    margin: 26px auto 0;
    width: 210px;
    height: 4px;
    border-radius: 999px;
    background: rgba(85,98,124,0.14);
    overflow: hidden;
  }
  .mn-boot-progress div {
    width: 70%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #8aa8ff, #91dec3, transparent);
    transform-origin: left center;
    animation: mnLaunchBar 1.55s cubic-bezier(.65,0,.35,1) infinite;
  }
  .mn-boot-core {
    position: relative;
    width: min(620px, calc(100vw - 48px));
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: mnSlideUp 420ms cubic-bezier(.2,.8,.2,1);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="mn-boot-splash" class="mn-boot-splash">
  <div class="mn-boot-grid"></div>
  <div class="mn-boot-light-field" aria-hidden="true">
    <span class="mn-light-bloom" style="--bloom-color:#f3bfd8; --bloom-duration:7.6s; --bloom-delay:-1.2s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#a9c2ff; --bloom-duration:8.8s; --bloom-delay:-3.4s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#9fe2c9; --bloom-duration:9.6s; --bloom-delay:-5.1s;"></span>
    <span class="mn-light-ripple" style="--ripple-color:#f3bfd8; --ripple-duration:4.8s; --ripple-delay:0s;"></span>
    <span class="mn-light-ripple" style="--ripple-color:#a9c2ff; --ripple-duration:4.8s; --ripple-delay:-1.6s;"></span>
    <span class="mn-light-ripple" style="--ripple-color:#9fe2c9; --ripple-duration:4.8s; --ripple-delay:-3.2s;"></span>
  </div>
  <div class="mn-boot-core">
    <div class="mn-boot-brand" aria-label="OminiNote">
      <svg class="mn-boot-logo" viewBox="0 0 240 170" role="img" aria-hidden="true">
        <path class="mn-logo-aura" d="M44 58C44 32 76 23 98 44L120 65L142 44C164 23 196 32 196 58C196 84 165 94 142 73L120 51L98 73C75 94 44 84 44 58Z" stroke="#a8c7ff" pathLength="100"></path>
        <path class="mn-logo-aura" d="M66 96C42 107 42 145 74 149C77 169 111 169 119 145M174 96C198 107 198 145 166 149C163 169 129 169 121 145M120 83V145" stroke="#aaa5ff" pathLength="100"></path>
        <path class="mn-logo-aura" d="M142 44C164 23 196 32 196 58C196 84 165 94 142 73" stroke="#ff9c92" pathLength="100"></path>
        <path class="mn-logo-line" d="M44 58C44 32 76 23 98 44L120 65L142 44C164 23 196 32 196 58C196 84 165 94 142 73L120 51L98 73C75 94 44 84 44 58Z" stroke="#9bbdff" pathLength="100"></path>
        <path class="mn-logo-line mn-logo-line-soft" d="M66 96C42 107 42 145 74 149C77 169 111 169 119 145M174 96C198 107 198 145 166 149C163 169 129 169 121 145M120 83V145" stroke="#9b99ff" pathLength="100"></path>
        <path class="mn-logo-line mn-logo-line-soft" d="M72 122C85 111 102 114 108 127M168 122C155 111 138 114 132 127M86 84C96 78 107 78 116 85M154 84C144 78 133 78 124 85" stroke="#8d8dff" pathLength="100"></path>
        <path class="mn-logo-line" d="M142 44C164 23 196 32 196 58C196 84 165 94 142 73" stroke="#ff9c92" pathLength="100"></path>
      </svg>
      <div class="mn-boot-title mn-boot-wordmark"><span class="mn-word-omni">Omini</span><span class="mn-word-note">Note</span></div>
      <div class="mn-boot-tagline"><span>Capture</span><i></i><span>Organize</span><i></i><span>Remember</span></div>
    </div>
    <div class="mn-boot-subtitle">Connecting your workspace</div>
    <div class="mn-boot-progress"><div></div></div>
  </div>
</div>

</body>
