<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OminiNote</title>
<meta name="viewport" content="width=1400" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--mn-bg, #f6f7f9); }
  * { box-sizing: border-box; }
  button { font: inherit; }
  input, textarea { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 250 / 0.5); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.7 0.01 250 / 0.6); }

  @keyframes mnFadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mnSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnLaunchFloat {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -10px, 0) rotate(0.7deg); }
  }
  @keyframes mnLaunchScan {
    0% { transform: translateX(-120%); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
  }
  @keyframes mnLaunchPulse {
    0%, 100% { opacity: 0.42; transform: scale(0.94); }
    50% { opacity: 0.9; transform: scale(1); }
  }
  @keyframes mnLaunchDraw {
    from { stroke-dashoffset: 72; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes mnLaunchBar {
    0% { transform: translateX(-85%) scaleX(0.25); }
    45% { transform: translateX(-10%) scaleX(0.72); }
    100% { transform: translateX(100%) scaleX(0.35); }
  }
  @keyframes mnLightBloom {
    0%, 100% {
      opacity: 0.18;
      transform: translate(-50%, -50%) scale(0.42);
    }
    50% {
      opacity: 0.72;
      transform: translate(-50%, -50%) scale(1.2);
    }
  }
  @keyframes mnLightWash {
    0%, 100% { opacity: 0.32; transform: translate3d(-2%, -1%, 0) scale(1); }
    50% { opacity: 0.58; transform: translate3d(2%, 1%, 0) scale(1.04); }
  }
  .mn-boot-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(135deg, rgba(248, 238, 247, 0.62), rgba(237, 245, 255, 0.68) 44%, rgba(241, 250, 245, 0.66));
    color: #253044;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    transition: opacity 220ms ease;
  }
  .mn-boot-grid {
    position: absolute;
    inset: 0;
    opacity: 0.24;
    background-image:
      linear-gradient(rgba(86,99,124,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86,99,124,0.08) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }
  .mn-boot-light-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .mn-boot-light-field::before {
    content: '';
    position: absolute;
    inset: -18%;
    background:
      radial-gradient(circle at 18% 24%, rgba(243,191,216,0.48), transparent 26%),
      radial-gradient(circle at 78% 18%, rgba(169,194,255,0.46), transparent 28%),
      radial-gradient(circle at 76% 76%, rgba(159,226,201,0.44), transparent 30%),
      radial-gradient(circle at 20% 78%, rgba(245,213,142,0.40), transparent 28%);
    filter: blur(8px);
    animation: mnLightWash 9s ease-in-out infinite;
  }
  .mn-light-bloom {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--bloom-size);
    aspect-ratio: 1;
    border-radius: 999px;
    background:
      radial-gradient(circle, rgba(255,255,255,0.94) 0%, color-mix(in oklab, var(--bloom-color) 26%, white) 22%, color-mix(in oklab, var(--bloom-color) 54%, transparent) 48%, transparent 72%);
    filter: blur(var(--bloom-blur));
    mix-blend-mode: screen;
    animation: mnLightBloom var(--bloom-duration) ease-in-out infinite;
    animation-delay: var(--bloom-delay);
  }
  .mn-boot-title {
    position: relative;
    z-index: 1;
    font-family: 'Newsreader', Georgia, serif;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
    color: #253044;
  }
  .mn-boot-subtitle {
    position: relative;
    z-index: 1;
    margin-top: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #667187;
  }
  .mn-boot-progress {
    position: relative;
    z-index: 1;
    margin: 26px auto 0;
    width: 210px;
    height: 4px;
    border-radius: 999px;
    background: rgba(85,98,124,0.14);
    overflow: hidden;
  }
  .mn-boot-progress div {
    width: 70%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #8aa8ff, #91dec3, transparent);
    transform-origin: left center;
    animation: mnLaunchBar 1.55s cubic-bezier(.65,0,.35,1) infinite;
  }
  .mn-boot-core {
    position: relative;
    width: min(520px, calc(100vw - 48px));
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: mnSlideUp 420ms cubic-bezier(.2,.8,.2,1);
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="mn-boot-splash" class="mn-boot-splash">
  <div class="mn-boot-grid"></div>
  <div class="mn-boot-light-field" aria-hidden="true">
    <span class="mn-light-bloom" style="--bloom-size:92vmax; --bloom-color:#f3bfd8; --bloom-blur:26px; --bloom-duration:7.6s; --bloom-delay:-1.2s;"></span>
    <span class="mn-light-bloom" style="--bloom-size:112vmax; --bloom-color:#a9c2ff; --bloom-blur:34px; --bloom-duration:8.8s; --bloom-delay:-3.4s;"></span>
    <span class="mn-light-bloom" style="--bloom-size:102vmax; --bloom-color:#9fe2c9; --bloom-blur:30px; --bloom-duration:9.6s; --bloom-delay:-5.1s;"></span>
  </div>
  <div class="mn-boot-core">
    <div class="mn-boot-title">OminiNote</div>
    <div class="mn-boot-subtitle">Connecting your workspace</div>
    <div class="mn-boot-progress"><div></div></div>
  </div>
</div>

<script src="node_modules/react/umd/react.development.js"></script>
<script src="node_modules/react-dom/umd/react-dom.development.js"></script>
<script src="node_modules/@babel/standalone/babel.min.js"></script>

<script type="text/babel" src="src/theme.jsx"></script>
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/markdown.jsx"></script>
<script type="text/babel" src="src/blockFeatures.jsx"></script>
<script type="text/babel" src="src/outline.jsx"></script>
<script src="src/editorOps.js"></script>
<script type="text/babel" src="src/outliner.jsx"></script>
<script type="text/babel" src="src/graph.jsx"></script>
<script type="text/babel" src="src/sidebar.jsx"></script>
<script type="text/babel" src="src/notelist.jsx"></script>
<script type="text/babel" src="src/editor.jsx"></script>
<script type="text/babel" src="src/panels.jsx"></script>
<script type="text/babel" src="src/settings.jsx"></script>
<script type="text/babel" src="src/ai.jsx"></script>
<script type="text/babel" src="src/app.jsx"></script>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<MnApp />);
</script>
</body>
</html>
