<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VispNote</title>
<meta name="viewport" content="width=1400" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:* http://127.0.0.1:* https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" />
<link rel="icon" type="image/png" href="assets/vispnote-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Mono:wght@400&family=Instrument+Serif:ital@0;1&display=swap" />
<style>
  html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body { background: var(--mn-bg, #f6f7f9); }
  * { box-sizing: border-box; }
  button { font: inherit; }
  input, textarea { font: inherit; color: inherit; }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid var(--mn-focus, #4f6fd5);
    outline-offset: 2px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: oklch(0.85 0.01 250 / 0.5); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.7 0.01 250 / 0.6); }

  @keyframes mnFadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes mnSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnSlideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes mnLaunchFloat {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
    50% { transform: translate3d(0, -5px, 0) rotate(0.35deg); }
  }
  @keyframes mnLaunchScan {
    0% { transform: translateX(-120%); opacity: 0; }
    18% { opacity: 1; }
    82% { opacity: 1; }
    100% { transform: translateX(120%); opacity: 0; }
  }
  @keyframes mnLaunchPulse {
    0%, 100% { opacity: 0.42; transform: scale(0.94); }
    50% { opacity: 0.9; transform: scale(1); }
  }
  @keyframes mnLaunchDraw {
    from { stroke-dashoffset: 72; }
    to { stroke-dashoffset: 0; }
  }
  @keyframes mnStatusBreath {
    0%, 100% { opacity: 0.64; }
    50% { opacity: 0.92; }
  }
  @keyframes mnLightBloom {
    0%, 100% {
      opacity: 0.2;
      transform: scale(0.74);
    }
    50% {
      opacity: 0.58;
      transform: scale(0.98);
    }
  }
  @keyframes mnLightWash {
    0%, 100% { opacity: 0.28; transform: translate3d(-0.8%, -0.8%, 0); }
    50% { opacity: 0.58; transform: translate3d(0.8%, 0.8%, 0); }
  }
  @keyframes mnBootProgress {
    0% { transform: translateX(-78%) scaleX(0.34); opacity: 0.48; }
    42% { transform: translateX(-8%) scaleX(0.86); opacity: 0.96; }
    100% { transform: translateX(118%) scaleX(0.42); opacity: 0.44; }
  }
  .mn-boot-splash {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, transparent 44%),
      linear-gradient(135deg, rgba(248, 238, 247, 0.58), rgba(237, 245, 255, 0.68) 46%, rgba(241, 250, 245, 0.62));
    color: #253044;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    transition: opacity 220ms ease;
  }
  .mn-boot-grid {
    position: absolute;
    inset: 0;
    opacity: 0.16;
    background-image:
      linear-gradient(rgba(86,99,124,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(86,99,124,0.08) 1px, transparent 1px);
    background-size: 38px 38px;
    -webkit-mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
    mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
  }
  .mn-boot-light-field {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .mn-boot-light-field::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 24%, rgba(243,191,216,0.42), transparent 34%),
      radial-gradient(circle at 78% 18%, rgba(169,194,255,0.44), transparent 36%),
      radial-gradient(circle at 76% 76%, rgba(159,226,201,0.4), transparent 38%),
      radial-gradient(circle at 20% 78%, rgba(245,213,142,0.34), transparent 36%);
    animation: mnLightWash 10.5s ease-in-out infinite;
  }
  .mn-light-bloom {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, color-mix(in oklab, var(--bloom-color) 18%, white) 24%, color-mix(in oklab, var(--bloom-color) 34%, transparent) 48%, transparent 70%);
    transform-origin: center;
    animation: mnLightBloom var(--bloom-duration) ease-in-out infinite;
    animation-delay: var(--bloom-delay);
  }
  .mn-boot-title {
    position: relative;
    z-index: 1;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 52px;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1;
    color: #253044;
  }
  .mn-boot-brand {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: mnLaunchFloat 5.8s ease-in-out infinite;
    isolation: isolate;
  }
  .mn-boot-brand::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 48%;
    width: min(560px, 78vw);
    height: 170px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.76), rgba(255,255,255,0.28) 42%, transparent 72%);
    pointer-events: none;
    z-index: 0;
  }
  .mn-boot-logo {
    position: relative;
    z-index: 1;
    display: block;
    width: clamp(340px, 54vw, 720px);
    height: auto;
    max-height: 190px;
    object-fit: contain;
    margin: 0 auto 18px;
    mix-blend-mode: multiply;
    filter: drop-shadow(0 18px 34px rgba(36, 48, 71, 0.08));
  }
  .mn-boot-wordmark {
    display: none;
    align-items: baseline;
    justify-content: center;
  }
  .mn-word-omni {
    color: #243047;
  }
  .mn-word-note {
    color: #9a96ff;
    background: linear-gradient(90deg, #9d98ff 0%, #a6bcff 52%, #ff9a91 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .mn-boot-tagline {
    position: relative;
    z-index: 1;
    margin-top: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2d3952;
  }
  .mn-boot-tagline i {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, #9d98ff, #a6bcff);
  }
  .mn-boot-subtitle {
    position: relative;
    z-index: 1;
    margin-top: 14px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #5d687e;
  }
  .mn-boot-status {
    position: relative;
    z-index: 1;
    margin-top: 16px;
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #56647c;
    animation: mnStatusBreath 2.4s ease-in-out infinite;
  }
  .mn-boot-progress {
    position: relative;
    z-index: 1;
    width: min(230px, calc(100vw - 96px));
    height: 5px;
    margin-top: 18px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(84, 98, 126, 0.13);
    border: 1px solid rgba(255,255,255,0.62);
    box-shadow: 0 8px 20px rgba(78, 91, 122, 0.1);
  }
  .mn-boot-progress div {
    width: 62%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #f3bfd8 0%, #a9c2ff 48%, #9fe2c9 100%);
    transform-origin: left center;
    animation: mnBootProgress 1.65s cubic-bezier(.65,0,.35,1) infinite;
  }
  .mn-boot-core {
    position: relative;
    width: min(620px, calc(100vw - 48px));
    min-height: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: mnSlideUp 420ms cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-reduced-motion: reduce) {
    .mn-boot-core,
    .mn-boot-brand,
    .mn-boot-light-field::before,
    .mn-light-bloom,
    .mn-boot-status,
    .mn-boot-progress div {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="mn-boot-splash" class="mn-boot-splash">
  <div class="mn-boot-grid"></div>
  <div class="mn-boot-light-field" aria-hidden="true">
    <span class="mn-light-bloom" style="--bloom-color:#f3bfd8; --bloom-duration:7.6s; --bloom-delay:-1.2s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#a9c2ff; --bloom-duration:8.8s; --bloom-delay:-3.4s;"></span>
    <span class="mn-light-bloom" style="--bloom-color:#9fe2c9; --bloom-duration:9.6s; --bloom-delay:-5.1s;"></span>
  </div>
  <div class="mn-boot-core">
    <div class="mn-boot-brand" aria-label="VispNote">
      <img class="mn-boot-logo" src="assets/vispnote-loading-transparent.png" alt="VispNote" />
      <div class="mn-boot-title mn-boot-wordmark">VispNote</div>
      <div class="mn-boot-tagline"><span>Capture</span><i></i><span>Organize</span><i></i><span>Remember</span></div>
    </div>
    <div class="mn-boot-subtitle">Connecting your workspace</div>
    <div class="mn-boot-status">Opening vault and indexing notes</div>
    <div class="mn-boot-progress"><div></div></div>
  </div>
</div>

  root.render(<MnApp />);

</body>
</html>
