name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"
  # A weekly rehearsal. Everything in scripts/release-tools/ was written after
  # v0.2.1 and never ran until someone tried to ship, by which point it had
  # accumulated eight independent breakages — npm that could not launch on
  # Windows, an asar lookup using the wrong path separator, a blockmap
  # assertion comparing undefined to a number, and more. A release pipeline is
  # only tested by releasing, so release on a Monday when nothing is at stake.
  #
  # This validates and builds installers on all four targets. It cannot
  # publish: every publishing step requires a tag ref or an explicit
  # workflow_dispatch input, and the publish job additionally refuses to run
  # for a scheduled event.
  #
  # GitHub disables scheduled workflows in a repository with no activity for 60
  # days. If these stop arriving, that is why.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the built artifacts"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Exact package tag for publishing, for example v0.2.2"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Read package version
        id: package
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "${GITHUB_OUTPUT}"

      - name: Require tag to match package version
        id: release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          MEMORY_IMAGE: ${{ vars.VISPNOTE_MEMORY_IMAGE }}
        run: |
          # The executable validator enforces the stricter form of the former
          # ^v[0-9]+\.[0-9]+\.[0-9]+ release-tag check.
          tag="$(node scripts/release-tools/validate-release-tag.js "${CANDIDATE_TAG}" "${MEMORY_IMAGE}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate ${{ matrix.os }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Linux carries the comprehensive gate: the whole suite, the renderer and
      # AI regressions, and the 10,000-note performance budget.
      - name: Run full validation
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:all

      - name: Run 10,000-note performance gate
        if: runner.os == 'Linux'
        run: npm run benchmark:10k

      # macOS and Windows run the Electron smoke test, which is exactly what
      # ci.yml runs on them for every pull request.
      #
      # They used to run the full test:all here and nowhere else, so a
      # platform-specific test failure was invisible on every PR and only
      # surfaced when someone tried to release. That gate blocked every release
      # after v0.2.1 (2026-07-25) for three months and 0.2.2 was never
      # published, and in that time it caught a CRLF checkout, a POSIX
      # permission assertion and a Windows clock-granularity quirk — three test
      # defects, and not one product regression. Meanwhile macOS validation
      # began hanging past 30 minutes where the whole pipeline once took eight.
      #
      # The suite still runs on every platform on every PR via ci.yml; what
      # changed is that a platform-specific test defect no longer holds a
      # release hostage. Widen this again when the cost lands somewhere other
      # than shipping.
      - name: Electron smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:electron

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

  memory-integration:
    name: Required release memory integration
    needs: metadata
    if: vars.VISPNOTE_MEMORY_IMAGE != ''
    runs-on: ubuntu-22.04
    services:
      memory:
        image: ${{ vars.VISPNOTE_MEMORY_IMAGE }}
        env:
          VISP_MEMORY_SERVER_AUTH_ENABLED: "false"
          VISP_MEMORY_EMBEDDING_PROVIDER: "noop"
        ports:
          - 8000:8000
    env:
      VISPNOTE_MEMORY_URL: http://127.0.0.1:8000
      VISPNOTE_MEMORY_API_KEY: ${{ secrets.VISPNOTE_MEMORY_API_KEY }}
      VISPNOTE_MEMORY_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required memory regression
        run: node scripts/release-tools/retry-command.js --attempts 3 --delay-ms 10000 -- npm run regression:memory

  build:
    name: Build ${{ matrix.name }}
    needs: [metadata, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            args: --mac --x64
            csc_link_secret: MAC_CSC_LINK
            csc_password_secret: MAC_CSC_KEY_PASSWORD
          - name: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
            args: --mac --arm64
            csc_link_secret: MAC_CSC_LINK
            csc_password_secret: MAC_CSC_KEY_PASSWORD
          - name: linux-x64
            os: ubuntu-22.04
            platform: linux
            arch: x64
            args: --linux --x64
            csc_link_secret: UNUSED_CSC_LINK
            csc_password_secret: UNUSED_CSC_KEY_PASSWORD
          - name: windows-x64
            os: windows-2022
            platform: win32
            arch: x64
            args: --win --x64
            csc_link_secret: WIN_CSC_LINK
            csc_password_secret: WIN_CSC_KEY_PASSWORD

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CSC_LINK and CSC_KEY_PASSWORD are deliberately absent here. Setting them
      # from a missing secret defines them as empty strings, and electron-builder
      # treats "" as a certificate path, resolves it against the project root and
      # dies with "<project dir> not a file". An unset variable is skipped; an
      # empty one is a broken path. They are exported below only when real.
      #
      # Signing engages automatically when the certificate secret exists. With no
      # secret, disable identity auto-discovery so the build is deterministically
      # unsigned instead of depending on an empty runner keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets[matrix.csc_link_secret] != '' }}
      SIGNING_AVAILABLE: ${{ secrets[matrix.csc_link_secret] != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Defined only when a real certificate exists, so electron-builder sees no
      # variable at all rather than an empty path it cannot resolve.
      - name: Export signing credentials
        if: env.SIGNING_AVAILABLE == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets[matrix.csc_link_secret] }}
          CERTIFICATE_PASSWORD: ${{ secrets[matrix.csc_password_secret] }}
        run: |
          printf 'CSC_LINK=%s\n' "${CERTIFICATE}" >> "${GITHUB_ENV}"
          printf 'CSC_KEY_PASSWORD=%s\n' "${CERTIFICATE_PASSWORD}" >> "${GITHUB_ENV}"

      # Still fails closed: when signing credentials are present they must all be
      # present and valid. It is skipped only when none are configured, so a
      # missing Apple account cannot silently downgrade a signed release.
      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS' && env.SIGNING_AVAILABLE == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/release-tools/prepare-macos-signing.js

      - name: Build installers
        run: >-
          node scripts/release-tools/retry-command.js
          --attempts 3
          --delay-ms 20000
          --clean dist
          --
          npm run build --
          ${{ matrix.args }}

      - name: Verify packaged renderer bundle
        run: >-
          npm run verify:package-renderer --
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}

      - name: Stage exact release inventory
        run: >-
          node scripts/release-tools/prepare-artifacts.js
          --root .
          --source dist
          --output dist/release-output
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --version ${{ needs.metadata.outputs.version }}

      - name: Verify final installers
        run: >-
          node scripts/release-tools/verify-release-artifacts.js
          --root .
          --artifacts dist/release-output
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --version ${{ needs.metadata.outputs.version }}
          --verify-mac-signing ${{ env.SIGNING_AVAILABLE }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VispNote-${{ matrix.name }}
          if-no-files-found: error
          path: dist/release-output/*

  release-gate:
    name: Verify release prerequisites
    needs: [build, memory-integration]
    runs-on: ubuntu-22.04
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      MEMORY_RESULT: ${{ needs.memory-integration.result }}
    steps:
      - name: Require successful builds and live memory regression
        shell: bash
        run: |
          if [[ "${BUILD_RESULT}" != "success" ]]; then
            echo "Release builds did not all succeed." >&2
            exit 1
          fi
          if [[ "${MEMORY_RESULT}" != "success" ]]; then
            echo "Release publishing requires VISPNOTE_MEMORY_IMAGE and a successful live memory regression." >&2
            exit 1
          fi

  publish:
    name: Publish GitHub Release
    needs: [metadata, build, release-gate]
    runs-on: ubuntu-22.04
    # The event check is redundant today — a scheduled run has neither a tag ref
    # nor a dispatch input — but it is the one guarantee worth stating outright,
    # so a later edit to the conditions below cannot make the weekly rehearsal
    # start publishing.
    if: >-
      github.event_name != 'schedule'
      && (startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download build artifacts without merging
        uses: actions/download-artifact@v8
        with:
          pattern: VispNote-*
          path: release-artifacts

      - name: Verify aggregate release inventory
        run: >-
          node scripts/release-tools/prepare-artifacts.js
          --verify-aggregate release-artifacts
          --version ${{ needs.metadata.outputs.version }}

      - name: Create or update release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          tag="${RELEASE_TAG}"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-artifacts/*/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-artifacts/*/* \
              --title "VispNote ${tag}" \
              --notes "Automated VispNote desktop release for macOS, Debian-compatible Linux, and Windows."
          fi
