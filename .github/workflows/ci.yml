name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0

jobs:
  checks:
    name: Lint, tests, renderer build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Code checks run before the audits. A step failure skips the rest of the
      # job, so an advisory in a transitive dev dependency used to mask lint,
      # tests, the architecture gate and the build all at once — which is how
      # two files drifted past the 800-line hard limit unnoticed. The audits
      # still run and still fail the job; they just no longer hide anything.
      - name: Lint and syntax checks
        run: npm run check:main

      - name: Node tests
        run: npm run test:editor

      - name: Renderer build
        run: npm run build:renderer

      # The gate is scoped to what ships. Dev-tool advisories (electron-builder's
      # transitive tree) cannot reach a user, and letting them fail the job kept
      # CI red for weeks — which taught everyone to ignore it, and a red job
      # nobody reads is how a real failure slips through.
      #
      # The gate runs at --audit-level=low because severity labels do not map to
      # our exposure: the DOMPurify sanitizer bypass (GHSA-c2j3-45gr-mqc4) sat on
      # the note-content-to-DOM path and was rated "low", so a moderate threshold
      # waved it through.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      # Dev advisories stay visible in the logs but are advisory-only.
      - name: Full dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

  electron-regression:
    name: Electron ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux regression suite
            os: ubuntu-22.04
            full_regression: true
          - name: macOS smoke
            os: macos-15
            full_regression: false
          - name: Windows smoke
            os: windows-2022
            full_regression: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Electron smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke:electron

      - name: Electron smoke test
        if: runner.os != 'Linux'
        run: npm run smoke:electron

      - name: Renderer regression
        if: matrix.full_regression
        run: xvfb-run -a npm run regression:renderer

      - name: AI regression
        if: matrix.full_regression
        run: xvfb-run -a npm run regression:ai

  memory-integration-optional:
    name: Optional live memory integration
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run live memory regression when a local service is available
        run: npm run regression:memory
