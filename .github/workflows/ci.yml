name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.15.0

jobs:
  checks:
    name: Lint, tests, renderer build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and syntax checks
        run: npm run check:main

      - name: Node tests
        run: npm run test:editor

      - name: Renderer build
        run: npm run build:renderer

  electron-regression:
    name: Electron regression suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Renderer regression
        run: xvfb-run -a npm run regression:renderer

      - name: AI regression
        run: xvfb-run -a npm run regression:ai
