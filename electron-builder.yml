appId: com.vispnote.app
productName: VispNote
copyright: Copyright © 2026 djkeshawa

directories:
  output: dist

files:
  - OminiNote.html
  - main.js
  - preload.js
  - package.json
  - assets/**/*
  - lib/**/*
  - src/**/*
  - node_modules/**/*
  - "!**/*.map"
  - "!tests/**/*"
  - "!scripts/**/*"
  - "!dist/**/*"
  - "!release/**/*"
  - "!coverage/**/*"
  - "!VispNote/**/*"
  - "!OminiNote/**/*"
  - "!MyNote/**/*"
  - "!vispnote-web/**/*"
  - "!*.tgz"
  - "!*.log"

asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/sqlite-vec-*/**/*

npmRebuild: true
buildDependenciesFromSource: false

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

linux:
  category: Office
  maintainer: djkeshawa
  icon: assets/linux-icons
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

deb:
  afterInstall: scripts/linux-after-install.sh
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
  signtoolOptions:
    signingHashAlgorithms:
      - sha256

nsis:
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: VispNote
  uninstallDisplayName: VispNote
  uninstallUrlHelp: https://github.com/djkeshawa/visp-note/issues
  uninstallUrlInfoAbout: https://github.com/djkeshawa/visp-note

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
